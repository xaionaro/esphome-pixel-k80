esphome:
  on_boot:
    then:
      - light.turn_on: {id: pixel_controller_position_1, effect: SOS}
      - light.turn_on: {id: pixel_controller_position_1, effect: Lightning 1}
      - light.turn_on: {id: pixel_controller_position_1, effect: Lightning 2}
      - light.turn_on: {id: pixel_controller_position_1, effect: TV Screen}
      - light.turn_on: {id: pixel_controller_position_1, effect: Police}
      - light.turn_on: {id: pixel_controller_position_1, effect: Ambulance}
      - light.turn_on: {id: pixel_controller_position_1, effect: Fire Engine}
      - light.turn_on: {id: pixel_controller_position_1, effect: RGB Circle 1}
      - light.turn_on: {id: pixel_controller_position_1, effect: RGB Circle 2}
      - light.turn_on: {id: pixel_controller_position_1, effect: Custom Rainbow}
      - light.turn_on: {id: pixel_controller_position_1, effect: None}
      - light.turn_on: {id: pixel_controller_position_1, effect: sOs}
      - light.turn_on: {id: pixel_controller_position_1, effect: nOnE}
      - light.turn_on:
          id: pixel_controller_position_1
          effect: !lambda return std::string("SOS");
